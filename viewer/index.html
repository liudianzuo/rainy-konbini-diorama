<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#050a14">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="data:,">
<title>雨夜便利店 · HOSHIMI MART</title>
<style>
  html {
    height: 100%;
    height: 100dvh;
  }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #050a14;
    overscroll-behavior: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
  }
  body {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    height: 100dvh;
    touch-action: none;
  }
  #stage {
    position: absolute;
    inset: 0;
    cursor: grab;
    touch-action: none;
  }
  #stage:active { cursor: grabbing; }
  #konbini-canvas {
    display: block;
    width: 100%;
    height: 100%;
    touch-action: none;
    opacity: 0;
    transition: opacity 1.4s ease;
    filter: saturate(1.14) contrast(1.04);
  }
  #konbini-canvas.ready { opacity: 1; }
  #vignette {
    position: fixed;
    inset: 0;
    pointer-events: none;
    background: radial-gradient(ellipse at 50% 44%,
                rgba(0,0,0,0) 34%,
                rgba(1,4,10,0.16) 67%,
                rgba(1,4,10,0.52) 100%);
    mix-blend-mode: multiply;
  }
  /* Portrait phones show a lot of sky; keep the gradient readable. */
  @media (max-aspect-ratio: 3/4) {
    #vignette {
      background: radial-gradient(ellipse at 50% 52%,
                  rgba(0,0,0,0) 46%,
                  rgba(1,4,10,0.10) 74%,
                  rgba(1,4,10,0.34) 100%);
    }
  }
  #grain {
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: 0.055;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.7'/></svg>");
    mix-blend-mode: soft-light;
  }
</style>
</head>
<body>
  <div id="stage"></div>
  <div id="vignette"></div>
  <div id="grain"></div>

  <script src="vendor/three.min.js"></script>
  <script src="vendor/OrbitControls.js"></script>
  <script src="vendor/GLTFLoader.js"></script>
  <script src="vendor/CopyShader.js"></script>
  <script src="vendor/LuminosityHighPassShader.js"></script>
  <script src="vendor/EffectComposer.js"></script>
  <script src="vendor/ShaderPass.js"></script>
  <script src="vendor/RenderPass.js"></script>
  <script src="vendor/UnrealBloomPass.js"></script>
  <script src="scene_data.js"></script>
  <script src="viewer.js"></script>
</body>
</html>
